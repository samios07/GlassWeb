<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlassWeb</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0d14;
      color: #e6e9f2;
      padding: 14px;
      line-height: 1.45;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e2333;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand { font-size: 16px; font-weight: 800; letter-spacing: 0.4px; }
    .brand span { color: #fb923c; }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #171c2b;
      color: #93c5fd;
      border: 1px solid #26314d;
    }
    .actions { display: flex; gap: 8px; margin-bottom: 12px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 12px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { flex: 1; background: #f97316; color: #0b0d14; }
    .btn-ghost { background: #171c2b; color: #cbd5e1; border: 1px solid #283046; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: #121623;
      border: 1px solid #1f2538;
      border-radius: 8px;
      padding: 7px;
      text-align: center;
    }
    .stat-val { font-size: 13px; font-weight: 800; color: #f8fafc; }
    .stat-lbl { font-size: 10px; color: #94a3b8; }
    .card {
      background: #121623;
      border: 1px solid #1f2538;
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .tldr { font-size: 13px; color: #e2e8f0; }
    .fact-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #1d2233;
      font-size: 12px;
    }
    .fact-row:last-child { border-bottom: none; }
    .fact-k { color: #94a3b8; font-weight: 600; }
    .fact-v { color: #f8fafc; text-align: right; font-weight: 600; }
    .flag {
      background: #1a1318;
      border: 1px solid #522027;
      border-left: 3px solid #ef4444;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .flag.medium { border-left-color: #f59e0b; border-color: #4d3816; background: #191611; }
    .flag-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .flag-cat { font-size: 12px; font-weight: 800; color: #fca5a5; }
    .flag.medium .flag-cat { color: #fcd34d; }
    .flag-sev { font-size: 10px; text-transform: uppercase; font-weight: 800; opacity: 0.85; }
    .flag-snip { font-size: 11px; color: #cbd5e1; font-style: italic; margin-bottom: 4px; }
    .flag-exp { font-size: 12px; color: #e2e8f0; }
    .status { font-size: 12px; color: #94a3b8; text-align: center; padding: 18px 8px; }
    .error { color: #fca5a5; background: #2a1215; border: 1px solid #7f1d1d; padding: 10px; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Glass<span>Web</span></div>
    <div class="pill" id="engineBadge">READY</div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="scanBtn">Scan & X-Ray Page</button>
    <button class="btn-ghost" id="clearBtn">Clear</button>
  </div>

  <div class="stats" id="statsBar" style="display:none;">
    <div class="stat-box">
      <div class="stat-val" id="statPruned">—</div>
      <div class="stat-lbl">DOM Pruned</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statPii">—</div>
      <div class="stat-lbl">PII Scrubbed</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statTraps">—</div>
      <div class="stat-lbl">Traps Flagged</div>
    </div>
  </div>

  <div id="output">
    <div class="status">Open any portal, insurance page, or listing and click <b>Scan & X-Ray Page</b>.</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
